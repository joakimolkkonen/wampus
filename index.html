<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wampus the Wombat</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="terminal">
  <div id="cornerHint">ARROWS: N/E/S/W · ↑↓ WHEN SHOWN · <button id="helpBtn" type="button">HELP</button></div>
  <section id="title" class="screen title">
    <h1>WAMPUS<br><span style="font-size:.42em;letter-spacing:.16em">THE WOMBAT</span></h1>
    <div class="sub">A GAME OF EXPLORATION<br>AND POOR DECISIONS</div>
    <div class="press">[ PRESS ENTER ]</div>
  </section>

  <section id="game" class="screen game hidden">
    <div class="mapwrap">
      <pre id="map"></pre>
      <div id="exitbar" class="exitbar hidden" aria-label="Available exits"></div>
    </div>
    <div class="console">
      <div id="onboarding">
        ARROW KEYS MOVE. TYPE SIMPLE COMMANDS.
        TRY: LOOK, SHOUT, JUMP, HELP
      </div>
      <div id="contextline"></div>
      <div id="inventory"></div>
      <div id="log"></div>
      <div class="prompt"><span>&gt;</span><input id="cmd" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></div>
    </div>
  </section>
</main>

<script src="js/rooms.js"></script>
<script src="js/game.js"></script>
<script src="js/parser.js"></script>
</body>
</html>
